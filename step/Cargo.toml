[package]
name = "k3-step"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Run a Kimi-K3 decode manifest teacher-forced on one rank of a replicated batch, on kern"
publish = false

[[bin]]
name = "k3_step"
path = "src/main.rs"

# kern pinned by commit; the generator's KERN checkout is the same commit.
[dependencies]
anyhow = "1"
cudarc = { version = "=0.19.7", features = ["cuda-13000", "f16", "nccl"] }
kern-manifest = { git = "https://github.com/pegainfer-project/kern", rev = "5d0910c5e5beef5b1b204853ad65f3e1fe994777" }
kern-pool = { git = "https://github.com/pegainfer-project/kern", rev = "5d0910c5e5beef5b1b204853ad65f3e1fe994777" }
kern-runtime = { git = "https://github.com/pegainfer-project/kern", rev = "5d0910c5e5beef5b1b204853ad65f3e1fe994777" }
