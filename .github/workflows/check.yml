name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 scripts/check.py
      - run: python3 harness/cake_plan/check.py
